<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAINZ</title>
<style>
  :root{
    --bg:#ffffff; --surface:#f5f7f4; --text:#141817; --text2:#55605a;
    --text3:#7c857f; --border:#e4e8e5; --volt:#c4f82a; --volt-ink:#4c7300; --on-volt:#141817;
    --radius:16px; --maxw:640px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1110; --surface:#171a19; --text:#f5f7f5; --text2:#a5ada8;
      --text3:#79817b; --border:#262b29; --volt-ink:#c4f82a;}
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw); padding:40px 24px; text-align:center}
  .logo{font-weight:800; font-size:52px; letter-spacing:-0.03em; margin:0 0 8px}
  .logo .z{color:var(--volt-ink)}
  .tag{color:var(--text2); font-size:18px; margin:0 0 32px}
  .links{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .btn{padding:12px 22px; border-radius:999px; font-weight:700; text-decoration:none;
    border:1px solid var(--border); color:var(--text); background:var(--surface)}
  .btn.primary{background:var(--volt); color:var(--on-volt); border-color:transparent}
  .btn:hover{filter:brightness(1.03)}
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="logo">GAIN<span class="z">Z</span></h1>
    <p class="tag">Dein Kalorienziel wird kalibriert, nicht geraten.<br>
    Aufbau, Heimtraining und Motivation — für alle, denen Zunehmen schwerfällt.</p>
    <div class="links">
      <a class="btn" href="./datenschutz.html">Datenschutz</a>
      <a class="btn" href="./support.html">Support</a>
    </div>
  </div>
</body>
</html>
